<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Markdown viewer</title>
<style>
  /* Defaults match the Quartz language. The shell overrides these at runtime
     via a quartzite:theme message, because a sandboxed viewer has no
     same-origin access to the shell's stylesheet. */
  :root {
    --bg: #111721; --fg: #dbe4ef; --dim: #8496ad; --faint: #5b6b80;
    --line: #1e2836; --accent: #7dd3fc; --code-bg: #0d1219; --warn: #fca5a5;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    --body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --display: var(--body);
    --fs: 15px; --lh: 1.72; --radius: 8px; --bw: 1px;
    --wt-heading: 600; --tracking: -.2px; --measure: 760px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 26px 30px 60px; background: var(--bg); color: var(--fg);
    font-family: var(--body); font-size: var(--fs); line-height: var(--lh);
    -webkit-font-smoothing: antialiased;
    transition: background 140ms ease, color 140ms ease;
  }
  .wrap { max-width: var(--measure); }
  h1, h2, h3, h4 {
    font-family: var(--display); line-height: 1.3; margin: 1.6em 0 .5em;
    font-weight: var(--wt-heading); letter-spacing: var(--tracking);
  }
  h1 { font-size: 1.65em; margin-top: 0; }
  h2 { font-size: 1.3em; border-bottom: 1px solid var(--line); padding-bottom: .25em; }
  h3 { font-size: 1.1em; }
  h4 { font-size: 1em; color: var(--dim); }
  p { margin: 0 0 1em; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  ul, ol { margin: 0 0 1em; padding-left: 1.5em; }
  li { margin: .25em 0; }
  blockquote {
    margin: 0 0 1em; padding: .1em 1em; border-left: 3px solid var(--accent); color: var(--dim);
  }
  code {
    font-family: var(--mono); font-size: .875em;
    background: var(--code-bg); padding: .15em .38em; border-radius: calc(var(--radius) / 2);
  }
  pre {
    background: var(--code-bg); padding: 13px 15px; border-radius: var(--radius);
    overflow-x: auto; border: var(--bw) solid var(--line); margin: 0 0 1em;
  }
  pre code { background: none; padding: 0; font-size: .85em; line-height: 1.6; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
  table { border-collapse: collapse; width: 100%; margin: 0 0 1em; font-size: .92em; display: block; overflow-x: auto; }
  th, td { border: var(--bw) solid var(--line); padding: 6px 10px; text-align: left; }
  th { background: var(--code-bg); font-weight: 600; }
  img { max-width: 100%; }
  .wikilink { border-bottom: 1px dashed var(--accent); cursor: pointer; }
  .wikilink.broken { color: var(--warn); border-bottom-color: var(--warn); cursor: default; }
  .embed {
    border: var(--bw) solid var(--line); border-radius: var(--radius); overflow: hidden; margin: 0 0 1em;
  }
  .embed-bar { padding: 5px 10px; background: var(--code-bg); font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .embed iframe { width: 100%; height: 360px; border: 0; display: block; background: #fff; }
  .idle { color: var(--faint); font-family: var(--mono); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap" id="out"><span class="idle">Waiting for document…</span></div>

<script>
/* Markdown viewer — a Quartzite document that happens to render other documents.
 * It runs sandboxed with no same-origin access, so it can only ever damage
 * its own pane. It receives its target over postMessage. */

const out = document.getElementById('out');
let resolved = new Map();

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function inline(s) {
  let t = esc(s);

  // Code spans are protected first so markup inside them survives literally.
  const spans = [];
  t = t.replace(/`([^`]+)`/g, (_, code) => {
    spans.push(code);
    return `\u0001${spans.length - 1}\u0001`;
  });

  t = t.replace(/!\[\[([^\]|#]+)(?:[|#][^\]]*)?\]\]/g, (_, target) => wikilinkHTML(target, true));
  t = t.replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/g,
    (_, target, alias) => wikilinkHTML(target, false, alias));

  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, src) => `<img alt="${alt}" src="${src}">`);
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
    (_, text, href) => `<a href="${href}" target="_blank" rel="noopener">${text}</a>`);

  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/(^|\W)\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');

  t = t.replace(/\u0001(\d+)\u0001/g, (_, i) => `<code>${spans[+i]}</code>`);
  return t;
}

function wikilinkHTML(target, isEmbed, alias) {
  const key = target.trim().toLowerCase();
  const hit = resolved.get(key);
  const label = esc(alias || target);
  if (isEmbed && hit) {
    return `<span class="embed-marker" data-id="${esc(hit.id)}" data-title="${esc(target)}"></span>`;
  }
  if (!hit) return `<span class="wikilink broken" title="unresolved">${label}</span>`;
  return `<span class="wikilink" data-nav="${esc(hit.id)}">${label}</span>`;
}

function render(md) {
  const lines = md.replace(/\r\n/g, '\n').split('\n');
  let html = '', i = 0;

  // Strip frontmatter; the shell already shows title and tags.
  if (lines[0] === '---') {
    const end = lines.indexOf('---', 1);
    if (end > 0) i = end + 1;
  }

  let listType = null;
  const closeList = () => { if (listType) { html += `</${listType}>`; listType = null; } };

  for (; i < lines.length; i++) {
    const line = lines[i];

    const fence = line.match(/^```(\w*)/);
    if (fence) {
      closeList();
      const body = [];
      for (i++; i < lines.length && !lines[i].startsWith('```'); i++) body.push(lines[i]);
      html += `<pre><code>${esc(body.join('\n'))}</code></pre>`;
      continue;
    }

    if (/^\s*$/.test(line)) { closeList(); continue; }

    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { closeList(); html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; continue; }

    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { closeList(); html += '<hr>'; continue; }

    if (/^\s*>\s?/.test(line)) {
      closeList();
      const quote = [];
      for (; i < lines.length && /^\s*>\s?/.test(lines[i]); i++) quote.push(lines[i].replace(/^\s*>\s?/, ''));
      i--;
      html += `<blockquote>${inline(quote.join(' '))}</blockquote>`;
      continue;
    }

    if (line.includes('|') && lines[i + 1] && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      closeList();
      const cells = (l) => l.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map((c) => c.trim());
      const head = cells(line);
      i += 2;
      const rows = [];
      for (; i < lines.length && lines[i].includes('|'); i++) rows.push(cells(lines[i]));
      i--;
      html += `<table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>` +
        rows.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`).join('') +
        '</tbody></table>';
      continue;
    }

    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ul || ol) {
      const want = ul ? 'ul' : 'ol';
      if (listType !== want) { closeList(); html += `<${want}>`; listType = want; }
      html += `<li>${inline((ul || ol)[1])}</li>`;
      continue;
    }

    // Markdown wraps: consecutive plain lines are one paragraph, not several.
    closeList();
    const para = [line];
    while (i + 1 < lines.length && lines[i + 1].trim() !== '' && !startsBlock(lines[i + 1])) {
      i++;
      para.push(lines[i]);
    }
    html += `<p>${inline(para.join(' '))}</p>`;
  }
  closeList();
  return html;
}

// startsBlock reports whether a line opens a construct that must not be
// swallowed into the paragraph above it.
function startsBlock(line) {
  return /^```/.test(line.trim()) ||
    /^(#{1,6})\s/.test(line) ||
    /^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line) ||
    /^\s*>\s?/.test(line) ||
    /^\s*[-*+]\s+/.test(line) ||
    /^\s*\d+\.\s+/.test(line) ||
    line.includes('|');
}

function mount(html) {
  out.innerHTML = html;

  // Turn embed markers into live iframes: a transcluded artifact really runs.
  out.querySelectorAll('.embed-marker').forEach((el) => {
    const wrap = document.createElement('div');
    wrap.className = 'embed';
    wrap.innerHTML = `<div class="embed-bar">${esc(el.dataset.title)}</div>
      <iframe src="/d/${encodeURIComponent(el.dataset.id)}/" sandbox="allow-scripts"></iframe>`;
    el.replaceWith(wrap);
  });

  // Navigation must go through the shell; a sandboxed frame cannot do it alone.
  out.querySelectorAll('[data-nav]').forEach((el) => {
    el.addEventListener('click', () => {
      parent.postMessage({ type: 'quartzite:navigate', id: el.dataset.nav }, '*');
    });
  });
}

// The shell resolves its design language and forwards the palette, because a
// sandboxed frame cannot read the parent stylesheet. Mapping is explicit so the
// viewer stays independent of how many themes the shell happens to have.
const TOKEN_MAP = {
  '--bg': '--bg',
  '--fg': '--fg',
  '--fg-dim': '--dim',
  '--fg-faint': '--faint',
  '--line': '--line',
  '--accent': '--accent',
  '--warn': '--warn',
  '--bg-inset': '--code-bg',
  '--font-body': '--body',
  '--font-display': '--display',
  '--font-mono': '--mono',
  '--fs-base': '--fs',
  '--lh-read': '--lh',
  '--radius': '--radius',
  '--border': '--bw',
  '--weight-heading': '--wt-heading',
  '--tracking-h': '--tracking',
};

function applyTheme(tokens) {
  const root = document.documentElement;
  for (const [from, to] of Object.entries(TOKEN_MAP)) {
    const v = tokens[from];
    if (v) root.style.setProperty(to, v);
  }
  // Prose wants a measure regardless of what the shell uses for its chrome.
  const measure = tokens['--read-width'];
  root.style.setProperty('--measure', measure && measure !== 'none' ? measure : '760px');
}

window.addEventListener('message', (ev) => {
  const msg = ev.data;
  if (!msg) return;

  if (msg.type === 'quartzite:theme') {
    applyTheme(msg.tokens || {});
    return;
  }

  if (msg.type !== 'quartzite:doc') return;
  resolved = new Map((msg.links || [])
    .filter((l) => l.resolved)
    .map((l) => [l.title.trim().toLowerCase(), l]));
  mount(render(msg.content || ''));
});

parent.postMessage({ type: 'quartzite:ready' }, '*');
</script>
</body>
</html>
